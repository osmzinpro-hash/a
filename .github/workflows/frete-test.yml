name: Frete test

# Testa o cálculo do frete com CEPs reais (os serviços de CEP ficam bloqueados no ambiente de desenvolvimento).
on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Mostrar detalhes do mapa quando o frete não sai pela distância (1 = sim)'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test-frete.mjs
        env:
          FRETE_DEBUG: ${{ inputs.debug }}
