name: Vercel deploy

# Publica o site na conta da Vercel do dono, usando o token salvo no GitHub
# (Settings → Secrets and variables → Actions → New repository secret → VERCEL_TOKEN).
# mode=preview: prévia com banco de teste (SQLite temporário, loja sempre aberta, faixa de "prévia").
# mode=production: site de verdade, usando o Postgres (Neon) ligado ao projeto na Vercel.
# O repositório é público: a senha do painel da prévia entra só como SHA-256.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview ou production'
        required: true
        default: preview
      admin_hash:
        description: 'Só na prévia: SHA-256 da senha do painel (nunca a senha em si)'
        required: false

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Falta o segredo VERCEL_TOKEN no repositório (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link project
        run: npx --yes vercel@60 link --yes --project a --token "$VERCEL_TOKEN"

      - name: Deploy
        env:
          MODE: ${{ inputs.mode }}
          ADMIN_HASH: ${{ inputs.admin_hash }}
        run: |
          if [ "$MODE" = "production" ]; then
            if printf '%s' "$ADMIN_HASH" | grep -Eq '^[0-9a-f]{64}$'; then
              for e in production preview development; do
                npx --yes vercel@60 env rm ADMIN_PASSWORD_SHA256 $e --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
                printf '%s' "$ADMIN_HASH" | npx --yes vercel@60 env add ADMIN_PASSWORD_SHA256 $e --token "$VERCEL_TOKEN" >/dev/null
                if ! npx --yes vercel@60 env ls $e --token "$VERCEL_TOKEN" 2>/dev/null | grep -q SESSION_SECRET; then
                  openssl rand -hex 32 | npx --yes vercel@60 env add SESSION_SECRET $e --token "$VERCEL_TOKEN" >/dev/null
                fi
                npx --yes vercel@60 env rm DITOS_PREVIEW $e --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
              done
              echo "Senha do painel configurada."
            fi
            npx --yes vercel@60 env ls production --token "$VERCEL_TOKEN" | grep -Eo '^ *[A-Z_]+' | sort -u
            npx --yes vercel@60 deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee deploy.log
          else
            if ! printf '%s' "$ADMIN_HASH" | grep -Eq '^[0-9a-f]{64}$'; then echo "admin_hash precisa ser um SHA-256 (64 caracteres hexadecimais)"; exit 1; fi
            SECRET=$(openssl rand -hex 32)
            npx --yes vercel@60 deploy --yes --token "$VERCEL_TOKEN" \
              -e DITOS_PREVIEW=1 -e ADMIN_PASSWORD_SHA256="$ADMIN_HASH" -e SESSION_SECRET="$SECRET" 2>&1 | tee deploy.log
          fi
          url=$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' deploy.log | tail -1)
          [ -n "$url" ] || { echo "Não encontrei o endereço no log."; exit 1; }
          echo "DEPLOY_URL=$url" >> "$GITHUB_ENV"

      - name: Check the deployment
        run: |
          echo "URL: $DEPLOY_URL"
          sleep 5
          for p in / /admin /pedido/TESTE123 /api/health /api/menu /assets/video/hero-scrub.webm /assets/banners/combo.mp4; do
            printf '%-32s %s\n' "$p" "$(curl -s -o /dev/null -w '%{http_code} · %{time_total}s' "$DEPLOY_URL$p")"
          done
          echo "health: $(curl -s "$DEPLOY_URL/api/health")"
